<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jet Flight Simulator</title>
<style>

#stats{left:12px;top:calc(12px + env(safe-area-inset-top,0px))}
#right{right:12px;top:calc(12px + env(safe-area-inset-top,0px));text-align:right;pointer-events:auto}
#inv{margin-top:10px;background:rgba(255,255,255,.1);color:var(--hud);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 12px;font:inherit;font-size:11px;letter-spacing:1px}
#warn{left:50%;top:22%;transform:translateX(-50%);background:rgba(200,20,20,.85);font-size:26px;font-weight:bold;display:none;animation:bl .35s infinite alternate}
@keyframes bl{to{opacity:.35}}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,12,20,.6)}
.card{background:linear-gradient(160deg,rgba(22,52,82,.95),rgba(10,24,40,.95));border:1px solid rgba(120,180,230,.45);border-radius:20px;padding:26px 30px;max-width:420px;margin:16px;text-align:center;line-height:1.5;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card h1{margin:0 0 6px;font-size:34px;letter-spacing:4px;color:#fff;text-shadow:0 2px 14px rgba(120,200,255,.6)}
.card p{margin:6px 0;font-size:14px}
#go{margin-top:14px;font:inherit;font-size:18px;padding:13px 34px;border:0;border-radius:12px;background:linear-gradient(180deg,#5ff0a0,#2fbf70);color:#04210f;font-weight:bold;letter-spacing:2px;box-shadow:0 6px 20px rgba(63,209,127,.4)}
#joy,#thr{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));display:none;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);box-shadow:0 4px 18px rgba(0,0,0,.25)}
#joy{left:26px;width:140px;height:140px;border-radius:50%}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5)}
#thr{right:26px;width:56px;height:170px;border-radius:14px;overflow:hidden}
#tf{position:absolute;left:0;right:0;bottom:0;background:rgba(63,209,127,.7)}
#thr span{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:11px}
#fire{position:fixed;right:106px;bottom:calc(44px + env(safe-area-inset-bottom,0px));width:82px;height:82px;border-radius:50%;display:none;align-items:center;justify-content:center;background:rgba(255,80,60,.4);border:2px solid rgba(255,150,130,.8);font-size:14px;font-weight:bold;letter-spacing:1px}
@media (pointer:coarse){#joy,#thr{display:block}#fire{display:flex}.kb{display:none}}
</style></head><body>
<canvas id="c"></canvas>
<div class="box" id="stats"></div>
<div class="box" id="right"><div id="dist"></div><button id="inv">PITCH: NORMAL</button></div>
<div class="box" id="warn">PULL UP!</div>
<div id="joy"><div id="knob"></div></div>
<div id="thr"><div id="tf"></div><span>THR</span></div>
<div id="fire">FIRE</div>
<div id="ov"><div class="card">
<h1>✈ JET SIM</h1>
<p id="msg">Fly across an endless world. Stay out of the mountains and the sea, and blow up some buildings.</p>
<p class="kb">W/S pitch · A/D roll · Q/E rudder · Shift/Ctrl throttle · Space fire</p>
<p>Touch: left stick steers, right bar sets throttle, red button fires.</p>
<button id="go">TAKE OFF</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));
const S=new THREE.Scene(),SKY=0x9fd0ff;
S.background=new THREE.Color(0xc4def0);S.fog=new THREE.Fog(0xc4def0,1800,6200);
const cam=new THREE.PerspectiveCamera(65,1,1,7000);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
S.add(new THREE.HemisphereLight(0xdfefff,0x556644,.95));
const sun=new THREE.DirectionalLight(0xfff0d0,1);sun.position.set(3000,1800,-2500);S.add(sun);
const mx=(a,b,t)=>a+(b-a)*Math.min(1,Math.max(0,t)),sunDir=sun.position.clone().normalize();
let sky,sunSp;
(function(){const c=document.createElement('canvas');c.width=4;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
 g.addColorStop(0,'#2a63b8');g.addColorStop(.3,'#5b9be0');g.addColorStop(.5,'#c4def0');g.addColorStop(1,'#c4def0');x.fillStyle=g;x.fillRect(0,0,4,256);
 sky=new THREE.Mesh(new THREE.SphereGeometry(6200,24,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.BackSide,fog:false,depthWrite:false}));
 const d=document.createElement('canvas');d.width=d.height=128;const y=d.getContext('2d'),rg=y.createRadialGradient(64,64,0,64,64,64);
 rg.addColorStop(0,'rgba(255,255,240,1)');rg.addColorStop(.15,'rgba(255,240,190,.9)');rg.addColorStop(.4,'rgba(255,220,150,.25)');rg.addColorStop(1,'rgba(255,220,150,0)');y.fillStyle=rg;y.fillRect(0,0,128,128);
 sunSp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(d),fog:false,depthWrite:false,blending:THREE.AdditiveBlending}));
 sunSp.scale.set(1400,1400,1);sky.renderOrder=-2;sunSp.renderOrder=-1;S.add(sky,sunSp)})();

// ---- terrain (infinite, procedural) ----
function hash(i,j){const n=Math.sin(i*127.1+j*311.7)*43758.5453;return n-Math.floor(n)}
function noise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 return hash(i,j)*(1-u)*(1-v)+hash(i+1,j)*u*(1-v)+hash(i,j+1)*(1-u)*v+hash(i+1,j+1)*u*v}
function HR(x,z){let f=0,a=.5,s=1/5000;for(let o=0;o<5;o++){f+=a*noise(x*s+o*17,z*s+o*31);a*=.5;s*=2}
 return Math.max(0,f-.48)*3600}
const N=128,CELL=100;
// ---- cities (flattened sites on land, deterministic per 3000m cell) ----
const CS=2200,cc=new Map(),cityMeshes=new Map();
function cityAt(i,j){const k=(i+20000)*40009+(j+20000);if(cc.has(k))return cc.get(k);let c=null;
 const x=(i+.3+.4*hash(i+.5,j+.9))*CS,z=(j+.3+.4*hash(i+.9,j+.5))*CS,h=HR(x,z);
 if(h>35&&h<350){c={x,z,h0:h,b:new Map()};
  for(let gx=-12;gx<=12;gx++)for(let gz=-12;gz<=12;gz++){const d=Math.hypot(gx,gz)*40;if(d>470)continue;
   const r=hash(gx*3.1+i*11,gz*2.7+j*13);if(r<.12)continue;
   c.b.set(gx+','+gz,{w:18+hash(gx+i,gz+j)*14,h:12+Math.pow(1-d/520,2)*340*r+r*24})}}
 cc.set(k,c);return c}
function H(x,z){let h=HR(x,z);const ci=Math.floor(x/CS),cj=Math.floor(z/CS);
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const c=cityAt(ci+a,cj+b);if(!c)continue;
  const d=Math.hypot(x-c.x,z-c.z);if(d<1100){const t=d<680?0:(d-680)/420,s=t*t*(3-2*t);h=c.h0+(h-c.h0)*s}}
 return h}
function bH(x,z){const ci=Math.floor(x/CS),cj=Math.floor(z/CS);
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const c=cityAt(ci+a,cj+b);if(!c)continue;
  const dx=x-c.x,dz=z-c.z;if(Math.abs(dx)>500||Math.abs(dz)>500)continue;
  const gx=Math.round(dx/40),gz=Math.round(dz/40),v=c.b.get(gx+','+gz);
  if(v&&!(v.vox&&v.vox.left<=0)&&Math.abs(dx-gx*40)<v.w/2&&Math.abs(dz-gz*40)<v.w/2)return c.h0+.5+v.h}
 return 0}
const bg=new THREE.BoxGeometry(1,1,1),bm=new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true}),rm=new THREE.MeshLambertMaterial({map:(function(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
 x.fillStyle='#868b91';x.fillRect(0,0,64,64);x.fillStyle='#3a3e44';x.fillRect(0,26,64,12);x.fillRect(26,0,12,64);
 x.fillStyle='#d8c24a';x.fillRect(0,31,64,2);x.fillRect(31,0,2,64);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(26,26);return t})()});
bm.onBeforeCompile=sh=>{
 sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vP;varying vec3 vN;varying float vS;')
  .replace('#include <begin_vertex>','#include <begin_vertex>\nvec3 isc=vec3(length(instanceMatrix[0].xyz),length(instanceMatrix[1].xyz),length(instanceMatrix[2].xyz));vP=position*isc+vec3(0.,isc.y*.5,0.);vN=normal;vS=instanceMatrix[3].x*.13+instanceMatrix[3].z*.31;');
 sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vP;varying vec3 vN;varying float vS;float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}')
  .replace('#include <color_fragment>','#include <color_fragment>\nif(abs(vN.y)>.5){diffuseColor.rgb*=.55;}else{float u=abs(vN.x)>.5?vP.z:vP.x;vec2 c=vec2(u/5.,vP.y/4.);vec2 id=floor(c),f=fract(c);float w=step(.18,f.x)*step(f.x,.82)*step(.2,f.y)*step(f.y,.8)*step(2.,vP.y);float l=step(.55,h21(id+vS));vec3 glass=mix(vec3(.1,.18,.28),vec3(.55,.75,.92),l);diffuseColor.rgb=mix(diffuseColor.rgb,glass,w);}')};
function buildCity(k,c){const g=new THREE.Group();
 const gr=new THREE.Mesh(new THREE.CircleGeometry(520,40).rotateX(-Math.PI/2),rm);gr.position.set(c.x,c.h0+.5,c.z);g.add(gr);
 const im=new THREE.InstancedMesh(bg,bm,c.b.size),m4=new THREE.Matrix4(),col=new THREE.Color();let n=0;
 c.b.forEach((v,key)=>{const p=key.split(',').map(Number);v.i=n;v.im=im;v.p=p;
  m4.makeScale(v.w,v.h,v.w);m4.setPosition(c.x+p[0]*40,c.h0+.5+v.h/2,c.z+p[1]*40);im.setMatrixAt(n,m4);
  const s=.55+hash(p[0],p[1])*.35;col.setRGB(s*.9,s,s*1.05);im.setColorAt(n++,col)});
 im.instanceColor.needsUpdate=true;im.frustumCulled=false;im.material=bmPlain;gr.material=rmPlain;g.add(im);c.b.forEach(v=>{if(v.vox){im.setMatrixAt(v.i,ZM);if(v.vox.left>0)voxMesh(v,g)}});im.instanceMatrix.needsUpdate=true;g.userData={c,im,gr,tex:false};S.add(g);cityMeshes.set(k,g)}
function updCities(px,pz){const ci=Math.floor(px/CS),cj=Math.floor(pz/CS);
 for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++){const k=(ci+a)+','+(cj+b);if(cityMeshes.has(k))continue;const c=cityAt(ci+a,cj+b);if(c)buildCity(k,c)}
 cityMeshes.forEach((g,k)=>{const p=k.split(',').map(Number);lodCity(g,px,pz);
  if(Math.abs(p[0]-ci)>4||Math.abs(p[1]-cj)>4){S.remove(g);g.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh)o.geometry.dispose()});cityMeshes.delete(k)}})}
const tg=new THREE.PlaneGeometry(N*CELL,N*CELL,N,N);tg.rotateX(-Math.PI/2);
const tp=tg.attributes.position,bx=new Float32Array(tp.count),bz=new Float32Array(tp.count);
for(let k=0;k<tp.count;k++){bx[k]=tp.getX(k);bz[k]=tp.getZ(k)}
const cols=new Float32Array(tp.count*3);tg.setAttribute('color',new THREE.BufferAttribute(cols,3));
const terrain=new THREE.Mesh(tg,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true}));
terrain.frustumCulled=false;S.add(terrain);
let tcx=1e12,tcz=1e12;
function updTerrain(px,pz){
 const cx=Math.round(px/400)*400,cz=Math.round(pz/400)*400;
 if(cx===tcx&&cz===tcz)return;tcx=cx;tcz=cz;terrain.position.set(cx,0,cz);
 for(let k=0;k<tp.count;k++){
  const wx=cx+bx[k],wz=cz+bz[k],h=H(wx,wz),v=hash(wx*.013|0,wz*.013|0)*.09;
  let r,g,b;
  if(h<14){r=.8;g=.74;b=.5}
  else if(h<60){const t=(h-14)/46;r=mx(.8,.2,t);g=mx(.74,.5,t);b=mx(.5,.2,t)}
  else if(h<420){const t=(h-60)/360;r=.2+.1*t;g=.5-.14*t;b=.2-.04*t}
  else if(h<700){const t=(h-420)/280;r=mx(.3,.48,t);g=mx(.36,.44,t);b=mx(.16,.42,t)}
  else{const t=(h-700)/160;r=mx(.48,.96,t);g=mx(.44,.97,t);b=mx(.42,1,t)}
  tp.setY(k,h);cols[k*3]=r+v;cols[k*3+1]=g+v;cols[k*3+2]=b+v}
 tp.needsUpdate=true;tg.attributes.color.needsUpdate=true}
const water=new THREE.Mesh(new THREE.PlaneGeometry(15000,15000).rotateX(-Math.PI/2),
 new THREE.MeshPhongMaterial({color:0x1f6fb5,specular:0xffffff,shininess:90,transparent:true,opacity:.93}));water.position.y=1;S.add(water);

// ---- clouds ----
const clouds=[],cm=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x8a9bb0,transparent:true,opacity:.88});
const sg=new THREE.SphereGeometry(1,8,6);
for(let i=0;i<60;i++){const g=new THREE.Group();
 for(let j=0;j<4;j++){const m=new THREE.Mesh(sg,cm);m.scale.set(60+Math.random()*60,22+Math.random()*16,50+Math.random()*50);
  m.position.set((Math.random()-.5)*160,Math.random()*15,(Math.random()-.5)*120);g.add(m)}
 g.position.set((Math.random()-.5)*8000,500+Math.random()*1400,(Math.random()-.5)*8000);S.add(g);clouds.push(g)}

// ---- jet ----
const jet=new THREE.Group(),mat=(c,e)=>new THREE.MeshLambertMaterial({color:c,flatShading:true,side:THREE.DoubleSide,emissive:e||0});
const fus=new THREE.Mesh(new THREE.CylinderGeometry(.8,.55,8,8).rotateX(Math.PI/2),mat(0xc9d2dc));jet.add(fus);
const nose=new THREE.Mesh(new THREE.ConeGeometry(.8,3,8).rotateX(-Math.PI/2),mat(0xe04a3a));nose.position.z=-5.5;jet.add(nose);
function tri(a,b,c,color){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([...a,...b,...c],3));g.computeVertexNormals();return new THREE.Mesh(g,mat(color))}
jet.add(tri([0,0,-2],[-6.5,0,3.5],[6.5,0,3.5],0x7d8c9c));
jet.add(tri([0,.8,2],[0,3.6,4.2],[0,.8,4.2],0xe04a3a));
jet.add(tri([0,0,2.5],[-3,0,4.5],[3,0,4.5],0x7d8c9c));
const flame=new THREE.Mesh(new THREE.ConeGeometry(.5,3,8).rotateX(Math.PI/2),new THREE.MeshBasicMaterial({color:0xffa030}));
flame.position.z=5.5;jet.add(flame);S.add(jet);

// ---- input ----
const K={};let inv=1,jx=0,jy=0,thrTouch=null;
addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='KeyR'&&state==='over')start();if(/Arrow|Space/.test(e.code))e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
$('inv').onclick=()=>{inv=-inv;$('inv').textContent='PITCH: '+(inv>0?'NORMAL':'INVERTED')};
const joy=$('joy'),knob=$('knob');let jid=null;
function jm(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+70),dy=e.clientY-(r.top+70);
 const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform=''}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
const thr=$('thr');let tid=null;
function tm(e){const r=thr.getBoundingClientRect();thrTouch=Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height))}
thr.addEventListener('pointerdown',e=>{tid=e.pointerId;thr.setPointerCapture(tid);tm(e)});
thr.addEventListener('pointermove',e=>{if(e.pointerId===tid)tm(e)});
thr.addEventListener('pointerup',()=>tid=null);

// ---- game state ----
const pos=new THREE.Vector3(),q=new THREE.Quaternion(),cp=new THREE.Vector3(),cu=new THREE.Vector3(0,1,0);
let speed=150,throttle=.6,alive=false,state='menu',dist=0,t0=0,best=0,parts=[];
let hd=0,pa=0,ra=0,sp=0,sr=0,sy=0;
try{best=+localStorage.getItem('jetbest')||0}catch(e){}
const X=new THREE.Vector3(1,0,0),Y=new THREE.Vector3(0,1,0),Z=new THREE.Vector3(0,0,1),qd=new THREE.Quaternion();
const dbg=new THREE.BoxGeometry(1,1,1),eu=new THREE.Euler(),qc=new THREE.Quaternion();
// ---- LOD: textured buildings/roads only when close ----
const bmPlain=new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true}),rmPlain=new THREE.MeshLambertMaterial({color:0x5b6066}),cf=new THREE.Vector3();
function lodCity(g,px,pz){const u=g.userData,c=u.c,d=Math.hypot(px-c.x,pz-c.z),near=u.tex?d<1700:d<1400;
 if(near!==u.tex){u.tex=near;u.im.material=near?bm:bmPlain;u.gr.material=near?rm:rmPlain}
 g.visible=d<6800&&((c.x-cam.position.x)*cf.x+(c.z-cam.position.z)*cf.z>-700)}
// ---- voxel destruction ----
const ZM=new THREE.Matrix4().makeScale(0,0,0),VM=new THREE.Matrix4(),VC=new THREE.Color();
let destroyed=0,bpx=0,bpy=0,bpz=0,bdeb=0,debDirty=false,fireAlt=0,fireCd=0;
const vI=(x,ix,iy,iz)=>ix+x.nx*(iy+x.ny*iz);
function voxMesh(v,g){const x=v.vox,im=new THREE.InstancedMesh(bg,bmPlain,x.solid.length);
 for(let iz=0;iz<x.nz;iz++)for(let iy=0;iy<x.ny;iy++)for(let ix=0;ix<x.nx;ix++){const i=vI(x,ix,iy,iz);
  if(!x.solid[i]){im.setMatrixAt(i,ZM);im.setColorAt(i,VC.setRGB(1,1,1));continue}
  VM.makeScale(x.sw*1.001,x.sh*1.001,x.sw*1.001);VM.setPosition(x.ox+(ix+.5)*x.sw,x.oy+(iy+.5)*x.sh,x.oz+(iz+.5)*x.sw);im.setMatrixAt(i,VM);
  im.setColorAt(i,VC.setRGB(x.col[i*3],x.col[i*3+1],x.col[i*3+2]))}
 im.instanceColor.needsUpdate=true;im.frustumCulled=false;x.im=im;g.add(im)}
function voxelize(c,v,g){if(v.vox)return;
 const s=Math.max(7,Math.cbrt(v.w*v.w*v.h/600)),nx=Math.max(2,Math.ceil(v.w/s)),ny=Math.max(2,Math.ceil(v.h/s)),n=nx*nx*ny,col=new Float32Array(n*3),p=v.p,b=.55+hash(p[0],p[1])*.35;
 for(let iz=0;iz<nx;iz++)for(let iy=0;iy<ny;iy++)for(let ix=0;ix<nx;ix++){const i=ix+nx*(iy+ny*iz);let r=b*.9,gg=b,bb=b*1.05;
  if(iy===ny-1){r*=.55;gg*=.55;bb*=.55}else if(iy>0&&iy%2===1&&(ix+iz)%2===0){r=.3;gg=.45;bb=.62}
